user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream app_frontend { server nextjs-frontend:3000; }
    upstream app_worker   { server websocket-worker:3001; }
    upstream app_tiles    { server martin-tiles:8000; }

    # Frontend Server Routing
    server {
        listen 80;
        server_name connect.kiitconnect.com;
        location / {
            proxy_pass http://app_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Live Update WebSocket Gateway
    server {
        listen 80;
        server_name map-ws.kiitconnect.com;
        location / {
            proxy_pass http://app_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }

    # Vector Tile Server Cache Route
    server {
        listen 80;
        server_name map-tiles.kiitconnect.com;
        location / {
            proxy_pass http://app_tiles;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin "*";
            expires 1d;
        }
    }
}
