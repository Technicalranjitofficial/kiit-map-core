version: '3.8'

networks:
  map-tier:
    driver: bridge

services:
  # 1. Edge Proxy
  nginx:
    image: nginx:alpine
    container_name: map-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - map-tier
    depends_on:
      - nextjs-frontend
      - websocket-worker
      - martin-tiles
    restart: always

  # 2. Database Engine
  postgis:
    image: kartoza/postgis:16-3.4
    container_name: map-spatial-db
    environment:
      - POSTGRES_DB=kiit_map_db
      - POSTGRES_USER=kiit_admin
      - POSTGRES_PASS=SecureCampusAuthToken2026
    ports:
      - "5432:5432"
    volumes:
      - ./postgis_data:/var/lib/postgresql/data
    networks:
      - map-tier
    restart: always

  # 3. Vector Tile Streamer
  martin-tiles:
    image: ghcr.io/maplibre/martin:latest
    container_name: map-tile-server
    environment:
      - WATCH_MODE=true
      - DATABASE_URL=postgresql://kiit_admin:SecureCampusAuthToken2026@postgis:5432/kiit_map_db
    networks:
      - map-tier
    depends_on:
      - postgis
    restart: always

  # 4. Telemetry WebSocket Broker
  websocket-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: map-live-worker
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - map-tier
    restart: always

  # 5. Core Frontend Web Application
  nextjs-frontend:
    image: node:20-alpine
    container_name: map-nextjs-app
    working_dir: /app
    command: "sh -c 'npm install maplibre-gl react-map-gl socket.io-client --legacy-peer-deps && rm -rf .next && npm run build && npm run start'"
    volumes:
      - ./nextjs-app:/app
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_TILE_URL=https://map-tiles.kiitconnect.com
      - NEXT_PUBLIC_WS_URL=https://map-ws.kiitconnect.com
    networks:
      - map-tier
    restart: always
